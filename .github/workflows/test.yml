name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        neovim:
          - stable
          - nightly

    steps:
      - name: Checkout nvim-dapper
        uses: actions/checkout@v4

      - name: Install Neovim (${{ matrix.neovim }})
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      # (retried: the runners' network to Ubuntu's mirrors fails now and then; gdb missing still
      # fails the run, else the debugging tests would be skipped without anyone noticing)
      - name: Install gcc and gdb (for the debugging tests)
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 &&
              sudo apt-get install -y -o Acquire::Retries=3 gcc gdb && exit 0
            echo "apt failed (attempt $i), retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Run test suite
        run: scripts/test.sh
